name: Fork release retry

# Fork-only: rerun a release once when GitHub never assigned the macOS runner.

on:
  workflow_run:
    workflows: ['Fork sync and release']
    types: [completed]

permissions: {}

jobs:
  decide:
    if: github.repository == 'theangeloumali/orca' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      retry: ${{ steps.decide.outputs.retry }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: config/scripts/fork
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" --jq .jobs > jobs.json
          # A release published after this run started would be replaced as "latest" by an older build.
          newer=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq "[.[] | select(.published_at > \"$RUN_CREATED\")] | length > 0")
          jq -n --arg c "$RUN_CONCLUSION" --argjson a "$RUN_ATTEMPT" --argjson n "$newer" --slurpfile jobs jobs.json \
            '{run: {conclusion: $c, run_attempt: $a, newerSuccess: $n}, jobs: $jobs[0]}' > input.json
          decision=$(node config/scripts/fork/fork-release-retry.mjs < input.json)
          echo "$decision"
          echo "retry=$(jq -r .retry <<<"$decision")" >> "$GITHUB_OUTPUT"

  rerun:
    needs: decide
    if: needs.decide.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
